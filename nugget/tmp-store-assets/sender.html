<!doctype html><meta charset="utf-8"><title>sender</title>
<script>
(async()=>{
  const q=new URLSearchParams(location.search), set=q.get('set')||'ios-m';
  const names=['1-caretakers','2-log-in-a-tap','3-widgets','4-whole-day','5-sounds','6-free-no-ads'];
  const T=window.opener||(window.parent!==window?window.parent:null); if(!T) return;
  for(const n of names){
    const r=await fetch(set+'/'+n+'.png'); const buf=await r.arrayBuffer();
    T.postMessage({tmpStoreAsset:true,name:n+'.png',buf},'https://appstoreconnect.apple.com',[buf]);
  }
  T.postMessage({tmpStoreAssetDone:true},'https://appstoreconnect.apple.com');
})();
</script>
